name: Post New Hacker News Stories

permissions:
  contents: read

on:
  schedule:
    # Run every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  post-new-hn-stories:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Post new stories
        env:
          BLUESKY_HN_PASSWORD: ${{ secrets.BLUESKY_HN_PASSWORD }}
          BLUESKY_HN_USERNAME: ${{ secrets.BLUESKY_HN_USERNAME }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: yarn run post-new-hn-stories
