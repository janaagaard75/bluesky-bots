name: Post New dr.dk Links

permissions:
  contents: read

on:
  schedule:
    # Run every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  post-new-drdk-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Post new links
        env:
          BLUESKY_DRDK_PASSWORD: ${{ secrets.BLUESKY_DRDK_PASSWORD }}
          BLUESKY_DRDK_USERNAME: ${{ secrets.BLUESKY_DRDK_USERNAME }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: yarn run post-new-drdk-links
